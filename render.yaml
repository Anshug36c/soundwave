# SoundWave — one-click deploy on Render (free tier works)
# Push this repo to GitHub → Render dashboard → New → Blueprint → select repo. Done.
services:
  - type: web
    name: soundwave
    runtime: node
    plan: free
    # fast build: deterministic ci (no resolve/audit/fund), prod-only server deps,
    # server install runs in parallel with the client install+build
    buildCommand: npm --prefix server ci --omit=dev --no-audit --no-fund & SRV=$!; npm --prefix client ci --no-audit --no-fund && npm --prefix client run build; CLI=$?; wait $SRV; SRV=$?; exit $((CLI || SRV))
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: ITUNES_COUNTRY
        value: IN
      # Optional — get free keys to enrich artist data:
      # - key: LASTFM_API_KEY
      #   sync: false
