# SoundWave — one-click deploy on Render (free tier works)
# Push this repo to GitHub → Render dashboard → New → Blueprint → select repo. Done.
services:
  - type: web
    name: soundwave
    runtime: node
    plan: free
    # fast build: deterministic ci (no resolve/audit/fund), prod-only server deps,
    # server install runs in parallel with the client install+build
    buildCommand: npm --prefix server ci --omit=dev --no-audit --no-fund & SRV=$!; npm --prefix client ci --include=dev --no-audit --no-fund && npm --prefix client run build; CLI=$?; wait $SRV; SRV=$?; exit $((CLI || SRV))
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: ITUNES_COUNTRY
        value: IN
      # The free instance has 512 MB. Default cache is 160 MB, which plus the
      # ~41 MB baseline and V8 overhead gets OOM-killed under load — see the
      # warning at server/server.js:179. 64 MB still holds several full tracks.
      - key: AUDIO_CACHE_MB
        value: 64
      # CORS allowlist — leave unset for this single-process deploy (same-origin,
      # no CORS needed). Set it only if you also serve the client from another
      # origin, e.g. a Vercel static front end:
      # - key: FRONTEND_URL
      #   value: https://soundwave.vercel.app
      # Optional — get free keys to enrich artist data:
      # - key: LASTFM_API_KEY
      #   sync: false
      # Google sign-in (see AUTH_SETUP.md). Both set in the Render dashboard:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
