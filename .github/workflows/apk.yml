name: Build Android APK

# Builds the standalone APK: the real backend bundled inside, served to a WebView
# over loopback. The APK is attached as a downloadable artifact — no Android
# Studio needed, and no signing key required for a debug build.
#
# The runtime inside the APK is Termux's Node.js, fetched at build time by
# android/scripts/fetch-termux-nodejs.py rather than committed (~22 MB packed).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'server/**'
      - 'client/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'      # AGP 8 requires JDK 17

      # android-actions/setup-android is deliberately NOT used: its default
      # package list includes "tools", which Google removed from the SDK
      # repository, so it dies with "Failed to find package 'tools'" before this
      # workflow does anything. The runner image already ships the SDK, so all
      # that is needed is to point Gradle at it.
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          test -d "$SDK" || { echo "Android SDK not found at $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "--- SDK contents ---"
          ls "$SDK"

      # Fail fast on a dangling resource reference or a Kotlin type error. Both
      # are otherwise only discoverable by a full Gradle run, and each has
      # already cost a build. The typecheck uses kotlinc against the real
      # android-34 stub jar, so it reports the same errors at the same lines.
      - name: Check resource references
        run: python3 android/scripts/check-resources.py

      - name: Typecheck Kotlin
        run: bash android/scripts/typecheck-kotlin.sh

      # ---- 1. Build the web client ----
      - name: Build client
        run: |
          npm --prefix client ci --include=dev --no-audit --no-fund
          npm --prefix client run build

      # ---- 2. Assemble the Node project that goes inside the APK ----
      # The layout MUST mirror the repository: server code in server/, built
      # client in client/dist. server.js finds the client with
      # path.join(__dirname, '../client/dist'), so flattening server.js to the
      # project root makes it resolve outside the project and the app serves
      # 404s. Verified both ways locally.
      - name: Stage the embedded Node project
        run: |
          set -euo pipefail
          DEST=android/app/src/main/assets/nodejs-project
          rm -rf "$DEST/server" "$DEST/client"
          mkdir -p "$DEST/server" "$DEST/client"

          cp server/server.js server/auth.js server/des.js server/youtube.js server/package.json "$DEST/server/"
          cp -r client/dist "$DEST/client/dist"

          # production deps only. Both are pure JS (verified: 0 .node binaries,
          # 0 binding.gyp), so no cross-compilation for arm64 is needed.
          cd "$DEST/server"
          npm install --omit=dev --no-audit --no-fund
          npm cache clean --force

          echo "--- staged project ---"
          find .. -maxdepth 2 -not -path '*/node_modules/*' | sort
          du -sh node_modules

      - name: Verify the staged server boots and serves the app
        # Catches a bad stage (missing file, unresolved import, wrong layout)
        # here with a readable message, instead of as a dead WebView on a phone.
        run: |
          cd android/app/src/main/assets/nodejs-project
          PORT=5099 timeout 90 node -e "
            let failed = false;
            process.on('unhandledRejection', () => {});
            import('./main.js').then(async () => {
              let j = null;
              for (let i = 0; i < 120; i++) {
                try {
                  const r = await fetch('http://127.0.0.1:5099/api/health');
                  if (r.ok) { j = await r.json(); if (j.indexes && j.indexes.djp > 0) break; }
                } catch {}
                await new Promise(res => setTimeout(res, 500));
              }
              // Only require one provider: they are scraped third-party sites and
              // any of them can be down. The point is that the bundle is intact.
              if (!j || !j.indexes || !(j.indexes.djp > 0 || j.indexes.mrj > 0 || j.indexes.dj > 0)) {
                console.error('FAIL: provider indexes never loaded', j && j.indexes);
                process.exit(1);
              }
              const h = await fetch('http://127.0.0.1:5099/');
              const body = await h.text();
              if (h.status !== 200 || !body.includes('assets/index-')) {
                console.error('FAIL: server did not serve the built client', h.status, body.length);
                process.exit(1);
              }
              console.log('staged server OK:', JSON.stringify(j.indexes), '| serves the app');
              process.exit(0);
            }).catch(e => { console.error('FAIL:', e && e.message); process.exit(1); });
          "

      # ---- 3. Fetch the bundled Node runtime ----
      # Run before Gradle so a download or packaging failure fails here, with a
      # readable message, instead of as an opaque task failure.
      - name: Fetch the Termux Node runtime
        run: |
          set -euo pipefail
          command -v python3 >/dev/null || { echo "python3 missing on runner"; exit 1; }
          command -v readelf >/dev/null || { echo "readelf missing on runner"; exit 1; }
          command -v xz      >/dev/null || { echo "xz missing on runner"; exit 1; }

          python3 android/scripts/fetch-termux-nodejs.py \
            --arch arm64-v8a \
            --out  "$RUNNER_TEMP/termux-usr" \
            --tarball android/app/src/main/assets/runtime/usr.tar.xz \
            --jni-dir android/app/src/main/jniLibs/arm64-v8a

          # Independently re-check both halves of the runtime.
          #
          # The executable ships as lib/arm64-v8a/libnode.so so the installer
          # extracts it into nativeLibraryDir, which an app may exec from; a
          # binary the app writes to its own filesDir gets EACCES (errno 13) on
          # Android 10+, which is the bug this layout fixes.
          #
          # The library closure is checked against the TARBALL while simulating
          # the extractor, because several libraries node links against exist
          # only as a symlink to the versioned file — a name-only check passes
          # while the device ends up missing them.
          python3 - <<'PY'
          import io, lzma, os, re, subprocess, tarfile, zipfile

          node = 'android/app/src/main/jniLibs/arm64-v8a/libnode.so'
          with open(node, 'rb') as f:
              assert f.read(4) == b'\x7fELF', 'libnode.so is not an ELF file'
          assert oct(os.stat(node).st_mode & 0o777) == '0o755', 'libnode.so is not 0755'
          interp = subprocess.run(['readelf', '-lW', node],
                                  capture_output=True, text=True).stdout
          assert '/system/bin/linker64' in interp, 'libnode.so is not an Android binary'
          print(f'native binary OK: {os.path.getsize(node)/1e6:.1f} MB, '
                f'aarch64, interpreter /system/bin/linker64')

          p = 'android/app/src/main/assets/runtime/usr.tar.xz'
          raw = open(p, 'rb').read()
          assert raw[:6] == b'\xfd7zXZ\x00', 'not an xz stream'
          with lzma.open(io.BytesIO(raw)) as f:
              t = tarfile.open(fileobj=f)
              members = list(t.getmembers())
              names = {m.name for m in members}
              assert all(not n.startswith('/') for n in names), 'absolute path in tarball'
              assert './bin/node' not in names, (
                  'bin/node must not be in the tarball — it ships as libnode.so, '
                  'and a copy in filesDir is not executable')

              # What the Kotlin extractor will actually produce on the device:
              # regular files, plus symlinks whose target is present.
              regular = {m.name.split('/')[-1] for m in members
                         if m.isreg() and '/lib/' in m.name}
              links = {m.name.split('/')[-1]: m.linkname
                       for m in members if m.issym() and '/lib/' in m.name}
              have = set(regular)
              for name, target in links.items():
                  if any(('/lib/' + target) in n for n in names):
                      have.add(name)

          need = subprocess.run(['readelf', '-dW', node],
                                capture_output=True, text=True).stdout
          need = re.findall(r'NEEDED\)\s+Shared library: \[([^\]]+)\]', need)
          system = {'libc.so', 'libm.so', 'libdl.so', 'liblog.so'}
          missing = [d for d in need if d not in system and d not in have]
          assert not missing, (
              f'libraries node needs would be MISSING on the device after '
              f'extraction: {missing}')

          dangling = [n for n, tgt in links.items()
                      if not any(('/lib/' + tgt) in x for x in names)]
          n_reg = sum(1 for m in members if m.isreg())
          print(f'runtime asset OK: {len(members)} entries ({n_reg} files, '
                f'{len(links)} symlinks), closure complete, {len(raw)/1e6:.1f} MB')
          if dangling:
              print(f'  note: {len(dangling)} symlinks point at pruned targets '
                    f'({", ".join(sorted(dangling))}); node needs none of them')
          PY

      # ---- 4. Build the APK ----
      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Report APK
        run: |
          find android -name '*.apk' -exec ls -lh {} \;

      - uses: actions/upload-artifact@v7
        with:
          name: soundwave-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
