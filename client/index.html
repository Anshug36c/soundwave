<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <!-- The type system is system-font based (--font-sans). Loading a webfont the
         CSS never references only blocks first paint on a phone, so it's gone. -->
    <meta name="description" content="SoundWave — search millions of songs, build playlists, and listen free. Punjabi hits, albums, lyrics, offline mode." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SoundWave" />
    <meta property="og:title" content="SoundWave — Music for Everyone" />
    <meta property="og:description" content="Search millions of songs, build playlists, and listen free." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SoundWave — Music for Everyone" />
    <meta name="twitter:description" content="Search millions of songs, build playlists, and listen free." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>SoundWave — Music for Everyone</title>
    <script>
    // Boot watchdog: if React fails to mount (e.g. a stuck service worker serves a
    // stale shell), drop service workers once per session and reload to self-heal.
    (function () {
      window.__SW_ERRORS = [];
      window.addEventListener('error', function (e) { window.__SW_ERRORS.push(String((e && e.message) || 'script error')); }, true);
      window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; window.__SW_ERRORS.push('rejection: ' + String((r && r.message) || r)); });
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (window.__SOUNDWAVE_MOUNTED) return;
          try {
            if (!sessionStorage.getItem('swreset1')) {
              sessionStorage.setItem('swreset1', '1');
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (rs) {
                  rs.forEach(function (r) { r.unregister(); });
                  setTimeout(function () { location.reload(); }, 400);
                });
                return;
              }
              location.reload();
              return;
            }
          } catch (err) { /* storage unavailable */ }
          var root = document.getElementById('root');
          if (root) {
            root.innerHTML = '<div style="font-family:system-ui;padding:2rem;max-width:520px;margin:2rem auto;background:#fff;border:3px solid #141414;border-radius:16px;color:#141414">'
              + '<h2 style="margin:0 0 .5rem">SoundWave couldn\'t start 😞</h2>'
              + '<p style="font-size:14px">Please hard-refresh (Ctrl+Shift+R) or clear site data and try again.</p>'
              + (window.__SW_ERRORS.length ? '<pre style="font-size:11px;background:#f4f4f4;padding:.75rem;border-radius:8px;overflow:auto">' + window.__SW_ERRORS.slice(0, 4).join('\n').replace(/</g, '&lt;') + '</pre>' : '')
              + '</div>';
          }
        }, 5000);
      });
    })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
